[package]
name = "spacesniffer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu_no_default_features", "clipboard"] }
# Vulkan only (Fifo present).
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

raw-window-handle = "0.6"

[features]
# Console build that prints frame timings (see src/perf.rs): cargo build --release --features perf
perf = []

[profile.release]
# Smallest exe (~540 KB under "s"); the scan is I/O-bound, but layout and per-frame instance
# building run 20-30% slower (e.g. ~520 vs ~650 fps uncapped in an 84k-tile folder).
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# eframe depends on image(+png/deflate/crc32) only for its default egui icon and the taskbar icon;
# we set icons from the exe resource instead (win::setup_window), so swap in a stub (see stub/image).
[patch.crates-io]
image = { path = "stub/image" }
