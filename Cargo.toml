[package]
name = "spacesniffer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu_no_default_features", "clipboard"] }
# Vulkan only (Mailbox + DwmFlush pacing).
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Console build that prints frame timings (see src/perf.rs): cargo build --release --features perf
perf = []

[profile.release]
# Size-optimised: the hot paths are I/O-bound (scan) or on the GPU; measured no fps/scan-time loss.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
